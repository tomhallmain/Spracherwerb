[pytest]
# Disable parallel execution
# This ensures that tests that depend on external services
# (like Gutenberg, Common Voice, Forvo) don't interfere with each other
# and that rate limits are respected
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --import-mode=importlib: do not prepend each test dir to sys.path (avoids
# shadowing top-level packages such as ``Spracherwerb``).
# -m "not network": keep the default run offline and fast. A command-line -m
# overrides this one, so `pytest -m network` selects exactly those tests.
addopts = -v --import-mode=importlib -m "not network"

# One marker per line: pytest reads this as a line list, so a wrapped
# description would register as its own bogus marker.
#
# network is deselected by default because those tests are slow, need an
# internet connection and sometimes API keys, and fail on the external
# service's bad day rather than on a change of yours.
markers =
    network: hits a live external service. Run these with `pytest -m network`.
    integration: exercises several components together in-process, without network.

# Configure test ordering
# This ensures that related tests (like Gutenberg and GutenbergSelector)
# run in a predictable order
test_order = 
    test_gutenberg.py
    test_gutenberg_selector.py
    test_common_voice.py
    test_forvo.py

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning 